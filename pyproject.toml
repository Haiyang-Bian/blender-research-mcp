[project]
name = "blender-research-mcp"
version = "0.10.2"
description = "A local-first semantic MCP bridge for observable and reversible Blender research."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0,<2",
    "pillow>=11,<13",
    "pydantic>=2.10,<3",
]

[project.scripts]
blender-research-mcp = "blender_research_mcp.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/blender_research_mcp"]

[tool.hatch.build.targets.wheel.force-include]
"blender_addon/blender_research_mcp_addon" = "blender_research_mcp/managed_addon/blender_research_mcp_addon"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["blender_research_mcp"]
